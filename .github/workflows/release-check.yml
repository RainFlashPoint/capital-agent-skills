name: Release Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  full-local-gate:
    name: Full reproducible release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          /usr/bin/bwrap --die-with-parent --new-session --unshare-all --share-net --proc /proc --dev /dev --ro-bind /usr /usr --ro-bind /bin /bin /bin/true
      - run: bash scripts/release-check
        env:
          CAP_RELEASE_DIFF_BASE: HEAD^
